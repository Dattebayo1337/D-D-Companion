<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:17px/1.6 system-ui;padding:16px;background:#faf6ee;color:#29241e}input,select,button{font:inherit;padding:10px;margin:4px;max-width:100%;box-sizing:border-box}p{white-space:pre-wrap;overflow-wrap:anywhere}@media print{header,nav{display:none}}</style><header><h1>Правила без сети</h1><p>Снимки не обновляются автоматически. Повторно сохраните карточку при подключении, чтобы обновить её.</p><select id="edition" aria-label="Редакция"><option value="5e_2014">2014</option><option value="5e_2024">2024</option></select><input type="search" id="query" aria-label="Поиск" placeholder="Поиск"><p id="status"></p></header><nav id="list"></nav><article id="detail"></article><script>
const rows=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__CARDS_BASE64__'),c=>c.charCodeAt(0))));
const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
function show(c){const area=document.getElementById('detail');area.replaceChildren(el('h2',c.name),el('p',`${c.edition==='5e_2014'?'2014':'2024'} · версия ${c.version} · ${new Date(c.savedAt).toLocaleString('ru-RU')}`));for(const b of c.blocks)area.append(el('h3',b.title),el('p',b.text));area.append(el('h3','Источник и лицензия'),el('p',c.source),el('p',c.license));}
function render(){const list=document.getElementById('list');list.replaceChildren();const q=document.getElementById('query').value.toLowerCase();const filtered=rows.filter(c=>c.edition===document.getElementById('edition').value&&(c.name+' '+c.blocks.map(b=>b.text).join(' ')).toLowerCase().includes(q));document.getElementById('status').textContent=`Сохранено ${rows.length} / 200 · найдено ${filtered.length}`;for(const c of filtered){const b=el('button',c.name);b.onclick=()=>show(c);list.append(b)}}
document.getElementById('query').oninput=render;document.getElementById('edition').onchange=()=>{document.getElementById('detail').replaceChildren();render()};render();
</script></html>
