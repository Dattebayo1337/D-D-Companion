services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/companion.db
      DATABASE_PROVIDER: sqlite
      DND_HOST_KEY: ${DND_HOST_KEY:?Generate a private master key}
      DND_REGISTRATION: ${DND_REGISTRATION:-open}
      APP_ORIGIN: https://${SITE_DOMAIN:?Set your domain}
    volumes:
      - companion-data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  companion-data:
  caddy-data:
  caddy-config:
